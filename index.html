<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Visual Editor</title>

    <link rel="stylesheet" href="style.css">

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<header>
    <h1>PDF Visual Editor</h1>
    <p>Edit text, add images and generate PDF</p>
</header>

<div class="toolbar">

    <label class="button primary">
        📁 Open PDF
        <input type="file" id="pdfInput" accept=".pdf">
    </label>

    <button class="button" id="addText">
        ＋ Text
    </button>

    <label class="button">
        🖼 Add Image
        <input type="file" id="imageInput" accept="image/*">
    </label>

    <button class="button danger" id="deleteObject">
        🗑 Delete
    </button>

    <button class="button" id="prevPage">
        ◀ Previous
    </button>

    <span id="pageInfo">Page 0 / 0</span>

    <button class="button" id="nextPage">
        Next ▶
    </button>

    <button class="button success" id="downloadPdf">
        ⬇ Download PDF
    </button>

</div>

<div class="properties">

    <label>
        Text:
        <input type="text" id="textValue">
    </label>

    <label>
        Font Size:
        <input type="number" id="fontSize" value="18" min="6" max="100">
    </label>

    <button class="button" id="boldBtn">
        <b>B</b>
    </button>

    <button class="button" id="italicBtn">
        <i>I</i>
    </button>

</div>

<main>

    <div class="editor-wrapper">

        <canvas id="editorCanvas"></canvas>

    </div>

</main>

<div id="message">
    Upload a PDF to start editing.
</div>

<script src="app.js"></script>

</body>
</html>
