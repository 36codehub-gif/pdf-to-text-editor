<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Text Editor</title>

    <link rel="stylesheet" href="style.css">

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<header>
    <h1>PDF Text Editor</h1>
    <p>Double-click existing text to edit</p>
</header>

<div class="toolbar">

    <label class="btn blue">
        📁 Open PDF
        <input type="file" id="pdfFile" accept=".pdf">
    </label>

    <button class="btn" id="prevBtn">◀ Previous</button>

    <span id="pageInfo">Page 0 / 0</span>

    <button class="btn" id="nextBtn">Next ▶</button>

    <button class="btn green" id="downloadBtn">
        ⬇ Download PDF
    </button>

</div>

<div class="tools">

    <label>
        Font Size
        <input type="number" id="fontSize" value="16">
    </label>

    <label>
        Font
        <select id="fontFamily">
            <option value="Arial">Arial</option>
            <option value="Times New Roman">
                Times New Roman
            </option>
            <option value="Courier New">
                Courier New
            </option>
        </select>
    </label>

    <button id="boldBtn"><b>B</b></button>

    <button id="italicBtn"><i>I</i></button>

    <button id="addTextBtn">＋ Add Text</button>

    <button id="deleteBtn" class="red">
        Delete
    </button>

</div>

<div id="status">
    Upload a PDF.
</div>

<div id="editor">

    <div id="pageContainer">

        <canvas id="pdfCanvas"></canvas>

        <div id="textLayer"></div>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
